name: Update concours data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_concours.py
      - name: Commit if changed
        run: |
          git config user.name "concours-bot"
          git config user.email "bot@users.noreply.github.com"
          git add concours.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update concours data"
            git pull --rebase origin master
            git push
          fi
