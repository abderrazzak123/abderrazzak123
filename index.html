<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Concours — كونكوراتي</title>
<meta name="theme-color" content="#0071e3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#e9edf6; --accent:#0071e3; --accent2:#5e5ce6; --amber:#f5a623;
  --text:#1c1c1e; --muted:#6e6e73; --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.75); --border:rgba(255,255,255,.65);
  --shadow:0 8px 32px rgba(28,28,60,.12); --radius:28px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101018; --text:#f2f2f7; --muted:#a1a1aa;
    --glass:rgba(40,40,55,.5); --glass-strong:rgba(45,45,62,.7);
    --border:rgba(255,255,255,.14); --shadow:0 8px 32px rgba(0,0,0,.45); }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
  color:var(--text); min-height:100dvh; overflow-x:hidden;
  background:
    radial-gradient(120% 60% at 85% -5%, rgba(94,92,230,.35), transparent 60%),
    radial-gradient(100% 55% at 10% 0%, rgba(0,113,227,.30), transparent 60%),
    radial-gradient(90% 50% at 50% 110%, rgba(245,166,35,.18), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
header{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;
  backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
  background:var(--glass); border-bottom:1px solid var(--border);
}
.logo{
  width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-weight:800; font-size:15px;
  box-shadow:var(--shadow);
}
header .titles{flex:1; min-width:0}
header h1{margin:0;font-size:17px;line-height:1.2}
header .sub{font-size:12px;color:var(--muted)}
.refresh-btn{
  border:1px solid var(--border); background:var(--glass-strong); color:var(--accent);
  width:40px;height:40px;border-radius:50%; cursor:pointer; flex:0 0 auto;
  display:flex;align-items:center;justify-content:center; box-shadow:var(--shadow);
}
.refresh-btn.spinning svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#pull{
  height:0; overflow:hidden; display:flex; align-items:flex-end; justify-content:center;
  color:var(--muted); font-size:13px; transition:height .15s ease;
}
main{padding:14px 14px 120px; max-width:640px; margin:0 auto}
.section{display:none}
.section.active{display:block; animation:fade .25s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.card{
  background:var(--glass); border:1px solid var(--border); border-radius:var(--radius);
  backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--shadow); padding:18px; margin-bottom:14px;
}
.hero{background:linear-gradient(135deg, rgba(0,113,227,.85), rgba(94,92,230,.85)); color:#fff; border:none}
.hero .kicker{font-size:12px; opacity:.85}
.hero h2{margin:6px 0 4px; font-size:21px}
.hero .meta{font-size:13px; opacity:.92}
.days{
  display:inline-block; margin-top:10px; background:rgba(255,255,255,.22);
  border-radius:999px; padding:4px 12px; font-size:13px; font-weight:700;
}
.btn{
  display:inline-block; margin-top:12px; background:#fff; color:var(--accent);
  text-decoration:none; font-weight:700; font-size:14px; padding:10px 18px; border-radius:999px;
}
.btn.primary{background:var(--accent); color:#fff}
.btn.disabled{background:rgba(128,128,128,.18); color:var(--muted); pointer-events:none}
h3.sec-title{margin:18px 4px 10px; font-size:16px}
.concours h4{margin:0 0 4px; font-size:16px}
.concours .org{font-size:13px; color:var(--muted)}
.concours .dates{font-size:13px; margin-top:6px}
.concours .note{font-size:13px; color:var(--muted); margin-top:4px}
.chip{
  display:inline-block; font-size:12px; font-weight:700; border-radius:999px; padding:3px 10px;
  background:rgba(0,113,227,.12); color:var(--accent);
}
.chip.warn{background:rgba(245,166,35,.18); color:#9a6a00}
.chip.done{background:rgba(128,128,128,.15); color:var(--muted)}
.news-item{padding:12px 2px; border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-item .date{font-size:12px; color:var(--muted)}
.news-item .t{font-weight:700; margin:3px 0}
.news-item .b{font-size:13.5px; color:var(--muted); line-height:1.6}
.news-item a{color:var(--accent); font-size:13px; text-decoration:none; font-weight:600}
.updated{font-size:12px; color:var(--muted); text-align:center; margin:6px 0 2px}
nav.bottom{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px); z-index:30;
  display:flex; gap:4px; padding:6px; border-radius:999px;
  background:var(--glass-strong); border:1px solid var(--border);
  backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--shadow); width:min(92vw, 440px); justify-content:space-between;
}
nav.bottom button{
  flex:1; border:none; background:transparent; color:var(--muted); font-size:12.5px; font-weight:600;
  padding:9px 2px; border-radius:999px; cursor:pointer; font-family:inherit;
}
nav.bottom button.active{background:var(--accent); color:#fff}
.empty{text-align:center; color:var(--muted); padding:24px 10px; font-size:14px}
.toast{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 70px); left:50%; transform:translateX(-50%) translateY(-16px);
  background:var(--glass-strong); border:1px solid var(--border); color:var(--text);
  padding:9px 18px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:50;
  opacity:0; pointer-events:none; transition:all .25s ease; box-shadow:var(--shadow);
  backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="logo">MC</div>
  <div class="titles">
    <h1>My Concours</h1>
    <div class="sub">كونكوراتي — تتبع المباريات والمستجدات</div>
  </div>
  <button class="refresh-btn" id="refreshBtn" aria-label="تحديث">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
</header>
<div id="pull">اسحب للتحديث…</div>
<main id="main">
  <section class="section active" id="tab-home">
    <div id="hero"></div>
    <h3 class="sec-title">آخر المستجدات</h3>
    <div class="card" id="homeNews"></div>
  </section>
  <section class="section" id="tab-concours">
    <h3 class="sec-title">المباريات</h3>
    <div id="concoursList"></div>
  </section>
  <section class="section" id="tab-jobs">
    <h3 class="sec-title">المناصب</h3>
    <div class="card">
      <p style="margin:0 0 6px"><b>بوابة التشغيل العمومي</b></p>
      <p style="color:var(--muted);font-size:13.5px;margin:0">جميع مباريات الدولة والمناصب المفتوحة في مكان واحد.</p>
      <a class="btn primary" href="https://www.emploi-public.ma" target="_blank" rel="noopener">فتح البوابة الرسمية</a>
    </div>
    <div class="card">
      <p style="margin:0 0 6px"><b>بوابة وزارة المالية</b></p>
      <p style="color:var(--muted);font-size:13.5px;margin:0">مباريات الجمارك والخزينة والضرائب.</p>
      <a class="btn primary" href="https://e-recrutement.finances.gov.ma" target="_blank" rel="noopener">فتح البوابة الرسمية</a>
    </div>
  </section>
  <section class="section" id="tab-news">
    <h3 class="sec-title">المستجدات</h3>
    <div class="card" id="newsList"></div>
  </section>
  <p class="updated" id="updatedLine"></p>
</main>
<nav class="bottom">
  <button data-tab="home" class="active">الرئيسية</button>
  <button data-tab="concours">المباريات</button>
  <button data-tab="jobs">المناصب</button>
  <button data-tab="news">المستجدات</button>
</nav>
<div class="toast" id="toast"></div>
<script>
const FALLBACK = {
  updated: "2026-11-20",
  concours: [
    {id:"specialiste", title:"مختص الاقتصاد والإدارة", org:"وزارة التربية الوطنية — الأطر المختصة", deadline:"2026-11-25", exam:"2026-12-05", apply:"https://wolouj.men.gov.ma", note:"559 منصب — آخر أجل 25 نونبر مع 16:30"},
    {id:"baclibre", title:"الباك الحر 2027", org:"وزارة التربية الوطنية", deadline:"2026-12-04", exam:"", apply:"https://candidaturesbac.men.gov.ma", note:"علوم اقتصادية وتدبير — مسلك علوم اقتصادية"},
    {id:"primaire", title:"التعليم الابتدائي — مزدوج", org:"الأكاديميات الجهوية للتربية والتكوين", deadline:"2026-11-19", exam:"2026-11-28", apply:"https://wolouj.men.gov.ma", note:"لوائح المقبولين للكتابي: 24 نونبر — الكتابي: 28 نونبر"},
    {id:"adii", title:"مفتش الجمارك — الدرجة 2", org:"إدارة الجمارك والضرائب غير المباشرة", deadline:"", exam:"2026-09-20", apply:"https://e-recrutement.finances.gov.ma", note:"الكتابي داز في 20 شتنبر — النتائج لم تنشر بعد"},
    {id:"universites", title:"متصرف درجة 3 — علوم التدبير", org:"الجامعات المغربية", deadline:"2026-11-19", exam:"2026-11-29", apply:"https://recrutement.enssup.gov.ma", note:"أجل الترشيح انتهى"},
    {id:"ormvad", title:"متصرف درجة 3 — علوم اقتصادية وتدبير", org:"المكتب الجهوي للاستثمار الفلاحي لدكالة", deadline:"", exam:"2026-11-08", apply:"", note:"الكتابي داز في 8 نونبر بالجديدة"}
  ],
  news: [
    {date:"2026-11-20", title:"لوائح المقبولين للكتابي — التعليم الابتدائي", body:"تصدر اللوائح يوم 24 نونبر على بوابة الولوج.", link:"https://wolouj.men.gov.ma"},
    {date:"2026-11-20", title:"آخر أجل لمختص الاقتصاد والإدارة", body:"يغلق الترشيح يوم 25 نونبر مع 16:30. الكتابي يوم 5 دجنبر.", link:"https://wolouj.men.gov.ma"},
    {date:"2026-11-20", title:"كتابي التعليم الابتدائي", body:"الاختبار الكتابي يوم السبت 28 نونبر.", link:""},
    {date:"2026-11-20", title:"نتائج الجمارك", body:"نتائج كتابي مفتش الجمارك الدرجة 2 لم تنشر بعد.", link:"https://e-recrutement.finances.gov.ma"},
    {date:"2026-11-20", title:"آخر أجل للباك الحر", body:"يغلق التسجيل يوم 4 دجنبر 2026.", link:"https://candidaturesbac.men.gov.ma"}
  ]
};
let DATA = FALLBACK;

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr+"T00:00:00");
  return Math.round((d - today)/86400000);
}
function fmtDate(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr+"T00:00:00");
  return d.toLocaleDateString("ar-MA",{day:"numeric",month:"long",year:"numeric"});
}
function chipFor(c){
  const dd = daysUntil(c.deadline);
  if(dd !== null){
    if(dd > 0) return '<span class="chip">باقي '+dd+' يوم</span>';
    if(dd === 0) return '<span class="chip warn">اليوم آخر أجل</span>';
    return '<span class="chip done">انتهى الأجل</span>';
  }
  return '<span class="chip done">في الانتظار</span>';
}
function applyBtn(c, heroStyle){
  if(c.apply) return '<a class="btn'+(heroStyle?"":" primary")+'" href="'+esc(c.apply)+'" target="_blank" rel="noopener">الترشيح عبر البوابة الرسمية</a>';
  return '<span class="btn disabled">الترشيح ورقي — لا بوابة إلكترونية</span>';
}
function renderHero(){
  const upcoming = DATA.concours.filter(c=>{const d=daysUntil(c.deadline); return d!==null && d>=0;})
    .sort((a,b)=>new Date(a.deadline)-new Date(b.deadline))[0];
  const el = document.getElementById("hero");
  if(!upcoming){ el.innerHTML = '<div class="card hero"><div class="kicker">أقرب آخر أجل</div><h2>لا مباراة مفتوحة حاليا</h2><div class="meta">اسحب للتحديث لجلب آخر المستجدات</div></div>'; return; }
  const dd = daysUntil(upcoming.deadline);
  el.innerHTML = '<div class="card hero"><div class="kicker">أقرب آخر أجل</div><h2>'+esc(upcoming.title)+'</h2>'
    + '<div class="meta">'+esc(upcoming.org)+'<br>آخر أجل: '+fmtDate(upcoming.deadline)+(upcoming.exam?'<br>الكتابي: '+fmtDate(upcoming.exam):'')+'</div>'
    + '<span class="days">باقي '+dd+' يوم</span><br>'+applyBtn(upcoming,true)+'</div>';
}
function renderConcours(){
  const el = document.getElementById("concoursList");
  if(!DATA.concours.length){ el.innerHTML = '<div class="card empty">لا مباريات حاليا</div>'; return; }
  el.innerHTML = DATA.concours.map(c =>
    '<div class="card concours"><h4>'+esc(c.title)+'</h4><div class="org">'+esc(c.org)+'</div>'
    + '<div class="dates">'+chipFor(c)+(c.deadline?' &nbsp;آخر أجل: '+fmtDate(c.deadline):'')+(c.exam?'<br>الكتابي: '+fmtDate(c.exam):'')+'</div>'
    + (c.note?'<div class="note">'+esc(c.note)+'</div>':'')+applyBtn(c,false)+'</div>'
  ).join("");
}
function newsHtml(items){
  if(!items.length) return '<div class="empty">لا مستجدات حاليا</div>';
  return items.map(n =>
    '<div class="news-item"><div class="date">'+fmtDate(n.date)+'</div><div class="t">'+esc(n.title)+'</div>'
    + '<div class="b">'+esc(n.body)+'</div>'
    + (n.link?'<a href="'+esc(n.link)+'" target="_blank" rel="noopener">المصدر الرسمي ←</a>':'')+'</div>'
  ).join("");
}
function renderNews(){
  const sorted = [...DATA.news].sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById("newsList").innerHTML = newsHtml(sorted);
  document.getElementById("homeNews").innerHTML = newsHtml(sorted.slice(0,3));
  document.getElementById("updatedLine").textContent = DATA.updated ? "آخر تحديث للبيانات: "+fmtDate(DATA.updated) : "";
}
function renderAll(){ renderHero(); renderConcours(); renderNews(); }

let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
let refreshing = false;
async function refresh(showToast){
  if(refreshing) return; refreshing = true;
  const btn = document.getElementById("refreshBtn"); btn.classList.add("spinning");
  try{
    const res = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(res.ok){
      const fresh = await res.json();
      if(fresh && Array.isArray(fresh.concours) && Array.isArray(fresh.news)){ DATA = fresh; }
    }
    renderAll();
    if(showToast) toast("تم التحديث");
  }catch(e){ renderAll(); if(showToast) toast("تعذر الجلب — عرض آخر بيانات محفوظة"); }
  btn.classList.remove("spinning"); refreshing = false;
}
document.getElementById("refreshBtn").addEventListener("click", ()=>refresh(true));

document.querySelectorAll("nav.bottom button").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll("nav.bottom button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
    document.getElementById("tab-"+b.dataset.tab).classList.add("active");
    window.scrollTo({top:0});
  });
});

// Pull to refresh
let startY = 0, pulling = false;
const pullEl = document.getElementById("pull");
window.addEventListener("touchstart", e=>{
  if(window.scrollY <= 0){ startY = e.touches[0].clientY; pulling = true; }
}, {passive:true});
window.addEventListener("touchmove", e=>{
  if(!pulling) return;
  const dy = e.touches[0].clientY - startY;
  if(dy > 0 && window.scrollY <= 0){
    pullEl.style.height = Math.min(dy*0.5, 56)+"px";
    pullEl.textContent = dy > 110 ? "أطلق للتحديث" : "اسحب للتحديث…";
  }
}, {passive:true});
window.addEventListener("touchend", e=>{
  if(!pulling) return; pulling = false;
  const dy = (e.changedTouches[0].clientY - startY);
  pullEl.style.height = "0px";
  if(dy > 110) refresh(true);
});

renderAll();
refresh(false);
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
